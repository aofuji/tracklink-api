<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>TrackLink SignalR Test</title>
  </head>

  <body>
    <h1>TrackLink - SignalR Test</h1>

    <input id="token" placeholder="Tracking token" />

    <button onclick="connect()">Conectar</button>

    <h2>Status</h2>
    <div id="status">Desconectado</div>

    <h2>Localização</h2>
    <pre id="location">Aguardando...</pre>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

    <script>
      let connection;

      async function connect() {
        const token = document.getElementById("token").value;

        connection = new signalR.HubConnectionBuilder()
          .withUrl("/hubs/tracking")
          .build();

        connection.on("LocationUpdated", (tracking) => {
          console.log("LocationUpdated:", tracking);

          document.getElementById("location").textContent = JSON.stringify(
            tracking,
            null,
            2,
          );
        });

        connection.on("TrackingEnded", () => {
          console.log("Tracking encerrado");

          document.getElementById("status").textContent = "Tracking encerrado";
        });

        await connection.start();

        document.getElementById("status").textContent = "Conectado";

        await connection.invoke("JoinTracking", token);

        console.log("Entrou no tracking:", token);
      }
    </script>
  </body>
</html>
