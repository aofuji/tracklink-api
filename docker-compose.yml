services:
  postgres:
    image: postgres:16
    container_name: tracklink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracklink}
      POSTGRES_USER: ${POSTGRES_USER:-tracklink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracklink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
